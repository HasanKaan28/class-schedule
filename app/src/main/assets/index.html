<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Class Schedule</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-head">
  <div>
    <h1 data-i18n="appTitle">Class Schedule</h1>
    <p class="term" data-i18n="term">Fall 2026–27</p>
  </div>
  <div class="lang" role="group" id="langGroup">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="tr">TR</button>
  </div>
</header>

<main id="main">
  <section class="view" id="view-today" role="tabpanel" aria-labelledby="tab-today">
    <section class="status" id="status" aria-live="polite"></section>
    <div class="chips" id="chips"></div>
    <h2 class="day-title" id="dayTitle"></h2>
    <p class="hint" id="dayHint" hidden></p>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="view" id="view-week" role="tabpanel" aria-labelledby="tab-week" hidden>
    <p class="summary" id="summary"></p>
    <div class="week" id="week"></div>
    <p class="hint" data-i18n="tapHint"></p>
  </section>

  <section class="view" id="view-courses" role="tabpanel" aria-labelledby="tab-courses" hidden>
    <ul class="courses" id="courseList"></ul>
    <section class="notes">
      <h2 data-i18n="notes"></h2>
      <p data-i18n="attendance"></p>
    </section>
    <p class="source" data-i18n="source"></p>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-today" data-tab="today" data-i18n="today"></button>
  <button type="button" role="tab" id="tab-week" data-tab="week" data-i18n="week"></button>
  <button type="button" role="tab" id="tab-courses" data-tab="courses" data-i18n="courses"></button>
</nav>

<dialog id="sheet">
  <div id="sheetBody"></div>
  <button type="button" class="close" id="sheetClose" data-i18n="close"></button>
</dialog>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
