name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; the APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "class-schedule-${VERSION_NAME}.apk"

      - name: Check the APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs class-schedule-*.apk | grep -E "^Verified using|certificate DN"

      - uses: actions/upload-artifact@v4
        with:
          name: class-schedule-apk
          path: class-schedule-*.apk

      # The fixed name keeps .../releases/latest/download/class-schedule.apk pointing at the newest APK
      # (the club portal's download button uses it).
      - name: Add a copy under a fixed name
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp class-schedule-*.apk class-schedule.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            class-schedule-*.apk
            class-schedule.apk
          generate_release_notes: true
